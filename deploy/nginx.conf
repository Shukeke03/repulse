# Standalone instance: /usr/sbin/nginx -c /etc/repulse/nginx.conf
# This file deliberately does not include /etc/nginx/sites-enabled or conf.d.
user www-data;
worker_processes 1;
pid /run/repulse-proxy.pid;
error_log /var/log/repulse-proxy/error.log warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /var/log/repulse-proxy/access.log combined;
    client_body_temp_path /run/repulse-proxy/client-body;
    proxy_temp_path /run/repulse-proxy/proxy;

    map $http_upgrade $repulse_connection_upgrade {
        default upgrade;
        "" close;
    }

    # Allow the public app origin and clients that do not send Origin.
    # A non-browser client still needs HTTP Basic credentials.
    map $http_origin $repulse_origin_allowed {
        default 0;
        "" 1;
        "https://legion-wsl.tailb5f334.ts.net:8443" 1;
    }

    server {
        listen 127.0.0.1:8766;
        server_name legion-wsl.tailb5f334.ts.net;
        client_max_body_size 2m;

        if ($repulse_origin_allowed = 0) {
            return 403;
        }

        # Server-level authentication covers HTML, assets, API, docs and WS.
        auth_basic "RePulse";
        auth_basic_user_file /etc/repulse/htpasswd;

        location / {
            proxy_pass http://127.0.0.1:8765;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $repulse_connection_upgrade;
            proxy_set_header Host "legion-wsl.tailb5f334.ts.net:8443";
            proxy_set_header X-Forwarded-Host "legion-wsl.tailb5f334.ts.net:8443";
            proxy_set_header X-Forwarded-Port 8443;
            # Funnel terminates public HTTPS before proxying here over loopback.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Authentication is handled here; do not forward the password.
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 5s;
        }
    }
}
